name: Bug Report
description: Something isn't working right? Let us know so we can fix it.
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - "iOS App"
        - "Chrome Extension"
        - "Website"
    validations:
      required: true

  - type: dropdown
    id: app-version
    attributes:
      label: App / Extension Version
      description: Which version are you using? (iOS: Settings > About; Extension: chrome://extensions)
      options:
        - "1.3 (iOS)"
        - "1.2 (iOS)"
        - "1.0 (Chrome Extension)"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: os-version
    attributes:
      label: OS / Browser Version
      description: What OS or browser version are you running?
      options:
        - "iOS 26"
        - "iOS 18.5"
        - "iOS 18.4"
        - "iOS 18.3"
        - "iOS 18.2"
        - "Chrome 130+"
        - "Chrome 120-129"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see?
      placeholder: "When I tap the critique button, the app freezes for a few seconds..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see this bug ourselves?
      placeholder: |
        1. Open the app / extension
        2. Go to...
        3. Tap / click on...
        4. See the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: What were you expecting instead?
      placeholder: "The critique should have loaded within a few seconds."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If it helps, add screenshots or screen recordings.
      placeholder: Drag and drop images here.
    validations:
      required: false
